{{- if and .Values.cluster.enabled (gt (int .Values.streamingNode.replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ template "milvus.streamingnode.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "milvus.labels" . | indent 4 }}
    component: "streamingnode"
{{ include "milvus.ud.labels" . | indent 4 }}
spec:
  selector:
    matchLabels:
{{ include "milvus.matchLabels" . | indent 6 }}
      component: "streamingnode"
  minAvailable: {{ default 1 .Values.streamingNode.pdb.minAvailable }}
{{- end }}
